services:
  postgres:
    image: postgres:16-alpine
    container_name: jaynstan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaynstan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaynstan}
      POSTGRES_DB: ${POSTGRES_DB:-jaynstan}
    ports:
      - "2555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jaynstan-redis
    ports:
      - "2525:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
